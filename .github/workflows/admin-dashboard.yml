name: Admin dashboard regression

on:
  pull_request:
    branches: [feature/admin-marketplace-control-center]
    paths:
      - 'frontend/**'
      - 'tests/e2e/admin-dashboard-loading.spec.js'
      - 'playwright.admin.config.js'
      - 'package*.json'
      - '.github/workflows/admin-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: admin-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      - name: Type check
        run: npx tsc --noEmit --incremental false
        working-directory: frontend
      - name: Admin and session tests
        run: node --test lib/adminAuthFlow.test.ts lib/adminCockpit.test.ts lib/adminSessionCore.test.ts
        working-directory: frontend
      - name: Browser regression tests (mock API, no CMS credentials)
        run: npx playwright test --config playwright.admin.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-dashboard-browser-failure
          path: test-results/
          retention-days: 7
