services:
  strapi_green:
    image: node:20-bookworm-slim
    container_name: sharmar_strapi_green
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
        required: true
    env_file:
      - /opt/sharmar/app/shared/cms_green.env
      - .env.strapi_green_payments
    ports:
      - "127.0.0.1:1338:1337"
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SHARMAR_FRONTEND_NOTIFY_URL: ${SHARMAR_FRONTEND_NOTIFY_URL:-}
      SHARMAR_INTERNAL_NOTIFY_SECRET: ${SHARMAR_INTERNAL_NOTIFY_SECRET:-}
      SHARMAR_OWNER_ACTION_TOKEN: ${SHARMAR_OWNER_ACTION_TOKEN:-}
    volumes:
      - type: bind
        source: /opt/sharmar/app/cms_green
        target: /app
      - type: volume
        source: sharmar_cms_node_modules_green
        target: /app/node_modules
    command:
      - sh
      - -lc
      - npm run start
    restart: unless-stopped

volumes:
  sharmar_cms_node_modules_green: {}
